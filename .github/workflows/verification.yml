name: Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install pinned package manager
        run: npm install --global npm@11.19.1
      - name: Install locked dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Verify foundation
        run: npm run verify
      - name: Apply database migrations
        run: npm run database:migrate

  bun-verification:
    name: Bun 1.3.14 and Node.js fallback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned package managers
        run: npm install --global npm@11.19.1 bun@1.3.14
      - name: Install Bun lockfile
        run: bun install --frozen-lockfile
      - name: Verify Node.js fallback and Bun backend
        run: npm run verify:bun
